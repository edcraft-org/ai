name: CI

on:
  pull_request:
  push:
    branches: [main, 'wip/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  openai-template-live:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5-mini
      OPENAI_TIMEOUT_SECONDS: "120"
      OPENAI_MAX_RETRIES: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked
      - name: Require OpenAI API secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY repository secret is not configured"
            exit 1
          fi
      - name: Evaluate live OpenAI template approval
        run: >-
          uv run python -m edcraft_validator.cli evaluate
          --domain code
          --provider openai
          --model "$OPENAI_MODEL"
          --topic arithmetic
          --difficulty beginner
          --repetitions 1
          --output .artifacts/openai-pr-smoke.jsonl
      - name: Upload live evaluation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-template-evaluation
          path: .artifacts/openai-pr-smoke.jsonl
          if-no-files-found: warn
