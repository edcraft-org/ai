[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edcraft-validator"
version = "0.1.0"
description = "Reusable, deterministically validated EdCraft question templates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4,<5",
    "jsonschema>=4.23,<5",
    "hypothesis>=6.140,<7",
    "openai>=1.99,<2",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "step-tracer",
]

[project.optional-dependencies]
relevance = ["torch>=2.6,<3", "transformers>=5.0,<6"]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.12,<1",
]

[tool.uv.sources]
step-tracer = { git = "https://github.com/edcraft-org/step-tracer.git", rev = "ab7e22ef18b776a9cbd5260bef4b4eeacc17db11" }

[tool.hatch.build.targets.wheel.force-include]
"docs/difficulty-rubric.md" = "edcraft_validator/domains/code/difficulty-rubric.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "openai_live: real OpenAI template-authoring API test, run before a PR",
    "ollama_live: real Ollama template workflow, requires a running local model",
    "relevance_live: local Qwen relevance integration, requires downloaded model weights",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
