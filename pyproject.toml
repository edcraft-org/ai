[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edcraft-validator"
version = "0.1.0"
description = "Deterministic validation for AI-generated EdCraft questions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "step-tracer",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.uv.sources]
step-tracer = { path = "../step-tracer", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

