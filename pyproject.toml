[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edcraft-validator"
version = "0.1.0"
description = "Reusable, deterministically validated EdCraft question templates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.99,<2",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "step-tracer",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.uv.sources]
step-tracer = { git = "https://github.com/edcraft-org/step-tracer.git", rev = "ab7e22ef18b776a9cbd5260bef4b4eeacc17db11" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: tests requiring the Docker executor image",
    "openai_live: real OpenAI template-authoring API test, run before a PR",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
